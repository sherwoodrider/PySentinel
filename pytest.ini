[pytest]
# ---------- 采集范围 ----------
testpaths = test_cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---------- 默认参数 ----------
# -ra            : 汇总里列出所有非 passed 的简短原因
# --strict-markers : 拼错的 marker 直接报错，避免静默失效
# --tb=short     : 精简回溯，长堆栈会拖慢失败用例的日志输出
addopts = -ra --strict-markers --tb=short

# ---------- 异步用例 ----------
# auto 模式下无需在每个 async 用例上写 @pytest.mark.asyncio
# （test_function.py 里保留 marker 也完全兼容）
asyncio_mode = auto

# ---------- marker 注册 ----------
markers =
    ai: 依赖 LLM 判定的用例；用 -m "not ai" 可跳过全部 AI 判定
    flaky: 结果有抖动，建议配合 --reruns 使用
    slow: 执行较慢的用例；CI 冒烟可 -m "not slow" 过滤
    smoke: 冒烟用例

# ---------- 输出 ----------
log_cli = false
console_output_style = progress
